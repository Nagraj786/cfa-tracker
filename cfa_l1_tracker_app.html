<style>
:root{
  --paper:#F6F7F9;--card:#FFFFFF;--ink:#141C26;--soft:#5C6B7F;--rule:#DFE5EC;
  --pine:#125E4E;--pineSoft:#E6F0ED;--brass:#B07D2B;--brassSoft:#FBF2E0;
  --rust:#A8442A;--rustSoft:#FAEBE6;
  --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;}
button{font:inherit;}
#app{min-height:100vh;}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 28px;}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;color:var(--soft);}
.header{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:12px;gap:12px;}
.days-out{font-family:var(--mono);font-size:32px;font-weight:700;letter-spacing:-.04em;line-height:1;}
.days-out-label{font-size:12px;color:var(--soft);}
.stat-line{font-family:var(--mono);font-size:11px;color:var(--soft);margin-top:2px;text-align:right;}
.save-btn{margin-top:6px;font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.03em;
  padding:6px 10px;border-radius:6px;border:1px solid var(--pine);background:var(--pineSoft);color:var(--pine);cursor:pointer;white-space:nowrap;}
.runway{display:flex;gap:1.5px;align-items:flex-end;height:30px;}
.runway button{flex:1;min-width:0;border:none;padding:0;cursor:pointer;border-radius:1px;transition:background .2s;}
.runway-labels{display:flex;justify-content:space-between;margin-top:5px;margin-bottom:14px;font-family:var(--mono);font-size:9px;color:var(--soft);}
.card{background:var(--card);border-radius:12px;padding:16px 16px 18px;border:1px solid var(--rule);}
.tabs{display:flex;gap:6px;margin-top:12px;}
.tabs button{flex:1;padding:10px 0;border-radius:8px;cursor:pointer;font-family:var(--mono);font-size:11px;font-weight:700;
  letter-spacing:.05em;text-transform:uppercase;border:1px solid var(--rule);background:var(--card);color:var(--soft);}
.tabs button.active{border-color:var(--ink);background:var(--ink);color:#fff;}
.nav-btn{background:none;border:none;font-family:var(--mono);font-size:11px;color:var(--soft);cursor:pointer;padding:0;}
.nav-btn[disabled]{color:var(--rule);cursor:default;}
.jump-btn{background:var(--pineSoft);border:none;font-family:var(--mono);font-size:10px;color:var(--pine);
  cursor:pointer;padding:3px 9px;border-radius:5px;font-weight:700;}
.block{width:100%;text-align:left;display:flex;gap:12px;padding:14px 4px;background:none;border:none;
  border-top:1px solid var(--rule);cursor:pointer;align-items:flex-start;}
.checkbox{width:20px;height:20px;flex-shrink:0;margin-top:2px;border-radius:5px;border:1.5px solid var(--rule);
  display:flex;align-items:center;justify-content:center;transition:all .18s;background:transparent;}
.checkbox.checked{background:var(--accent);border-color:var(--accent);}
.block-body{flex:1;min-width:0;}
.block-line{font-size:13.5px;line-height:1.45;margin-bottom:2px;color:var(--ink);}
.block-line.done{text-decoration:line-through;color:var(--soft);}
.field-label{font-family:var(--mono);font-size:9px;color:var(--soft);margin-bottom:3px;}
.field-input{width:100%;padding:8px 9px;font-family:var(--mono);font-size:14px;border:1px solid var(--rule);
  border-radius:7px;background:var(--paper);color:var(--ink);}
.note-input{width:100%;margin-top:8px;padding:8px 9px;font-size:13px;font-family:var(--sans);border:1px solid var(--rule);
  border-radius:7px;background:var(--paper);color:var(--ink);resize:vertical;}
.mini-input{padding:5px 6px;font-family:var(--mono);font-size:11px;border:1px solid var(--rule);border-radius:5px;
  background:var(--paper);color:var(--ink);}
.group-header{width:100%;display:flex;align-items:center;gap:10px;padding:13px 2px;background:none;border:none;
  cursor:pointer;text-align:left;}
.overlay{position:fixed;inset:0;background:rgba(20,28,38,.45);display:flex;align-items:center;justify-content:center;
  padding:16px;z-index:1000;}
.modal{background:var(--card);border-radius:14px;padding:18px;max-width:480px;width:100%;max-height:85vh;overflow:auto;}
.modal-tabs{display:flex;gap:6px;margin-bottom:12px;}
.modal-tabs button{flex:1;padding:8px 0;border-radius:7px;cursor:pointer;font-family:var(--mono);font-size:10.5px;
  font-weight:700;text-transform:uppercase;letter-spacing:.04em;border:1px solid var(--rule);background:var(--paper);color:var(--soft);}
.modal-tabs button.active{border-color:var(--ink);background:var(--ink);color:#fff;}
.modal-help{font-size:12.5px;color:var(--soft);line-height:1.5;margin:0 0 10px;}
.export-box{width:100%;height:140px;font-family:var(--mono);font-size:11px;padding:10px;border:1px solid var(--rule);
  border-radius:8px;background:var(--paper);color:var(--ink);resize:vertical;}
.modal-btn{flex:1;padding:10px 0;border-radius:8px;cursor:pointer;font-family:var(--mono);font-size:11px;font-weight:700;
  border:1px solid var(--rule);background:var(--card);color:var(--ink);}
.modal-btn.primary{background:var(--pine);border-color:var(--pine);color:#fff;}
.feedback{margin-top:10px;font-size:12px;color:var(--pine);}
.feedback.error{color:var(--rust);}
.footer-note{font-size:10.5px;color:var(--soft);margin-top:14px;line-height:1.5;text-align:center;}
</style>
</head>

/* ---------- save / load ---------- */
function copyCode() {
  const text = JSON.stringify(STORE);
  const finish = (ok) => { copyFeedback = ok ? "Copied to clipboard." : "Couldn't copy — select the text and copy manually."; render(); };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => finish(true)).catch(() => finish(false));
  } else {
    finish(false);
  }
}
function downloadBackup() {
  const text = JSON.stringify(STORE, null, 2);
  const blob = new Blob([text], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const now = new Date();
  const stamp = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, "0")}-${String(now.getDate()).padStart(2, "0")}`;
  a.href = url;
  a.download = `cfa-l1-tracker-progress-${stamp}.json`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function applyImportedText(raw) {
  try {
    const parsed = JSON.parse(raw);
    if (!parsed || typeof parsed !== "object" || (!parsed.days && !parsed.mods)) throw new Error("shape");
    STORE = { days: parsed.days || {}, mods: parsed.mods || {} };
    modalOpen = null; importError = "";
    render();
  } catch (err) {
    importError = "Couldn't read that — check the code or file and try again.";
    render();
  }
}
function loadPasted() {
  const box = document.getElementById("importPasteBox");
  const raw = box ? box.value.trim() : "";
  if (!raw) { importError = "Paste your exported code first."; render(); return; }
  applyImportedText(raw);
}
function handleFileImport(file) {
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => applyImportedText(String(reader.result || ""));
  reader.onerror = () => { importError = "Could not read that file."; render(); };
  reader.readAsText(file);
}

function handleClick(e) {

  const el = e.target.closest("[data-action]");
  if (!el) return;
  const a = el.dataset.action;
  if (a === "pick-day") { cursorDate = el.dataset.dt; currentTab = "today"; render(); }
  else if (a === "set-tab") { currentTab = el.dataset.tab; render(); }
  else if (a === "prev-day") { const idx = DATA.days.findIndex(d => d.dt === cursorDate); if (idx > 0) { cursorDate = DATA.days[idx - 1].dt; render(); } }
  else if (a === "next-day") { const idx = DATA.days.findIndex(d => d.dt === cursorDate); if (idx < DATA.days.length - 1) { cursorDate = DATA.days[idx + 1].dt; render(); } }
  else if (a === "jump-today") { const t = todayISO(); if (DATA.days.find(d => d.dt === t)) cursorDate = t; render(); }
  else if (a === "toggle-block") { const dt = el.dataset.dt, slot = el.dataset.slot; const cur = STORE.days[dt] || {}; setDayPatch(dt, { [slot]: !cur[slot] }); render(); }
  else if (a === "toggle-module") { const s = el.dataset.mod; const cur = STORE.mods[s] || {}; setModPatch(s, { v: !cur.v }); render(); }
  else if (a === "set-confidence") { const s = el.dataset.mod, n = Number(el.dataset.n); const cur = STORE.mods[s] || {}; setModPatch(s, { c: cur.c === n ? null : n }); render(); }
  else if (a === "toggle-group") { const topic = el.dataset.topic; openGroup = openGroup === topic ? null : topic; render(); }
  else if (a === "open-export") { modalOpen = "export"; copyFeedback = ""; render(); }
  else if (a === "close-modal") { modalOpen = null; render(); }
  else if (a === "modal-tab") { modalOpen = el.dataset.tab; importError = ""; copyFeedback = ""; render(); }
  else if (a === "copy-code") { copyCode(); }
  else if (a === "download-backup") { downloadBackup(); }
  else if (a === "load-pasted") { loadPasted(); }
  else if (a === "trigger-file") { const f = document.getElementById("importFileInput"); if (f) f.click(); }
}
function handleChange(e) {
  const t = e.target;
  if (t.dataset && t.dataset.field === "day") { setDayPatch(t.dataset.dt, { [t.dataset.prop]: t.value }); render(); }
  else if (t.dataset && t.dataset.field === "mod") { setModPatch(t.dataset.mod, { [t.dataset.prop]: t.value }); render(); }
  else if (t.id === "importFileInput") { handleFileImport(t.files[0]); }
}

const appEl = document.getElementById("app");
appEl.addEventListener("click", handleClick);
appEl.addEventListener("change", handleChange);
render();
</script>
</body>
